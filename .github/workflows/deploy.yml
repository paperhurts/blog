name: Deploy

# Builds the site on every push to main and publishes it to GitHub Pages at
# paperhurts.com. The publish steps run only while the repo variable
# PAGES_LIVE is "true", which it has been since launch on 2026-09-25.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: vars.PAGES_LIVE == 'true'
        uses: actions/configure-pages@v6
      - if: vars.PAGES_LIVE == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: vars.PAGES_LIVE == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
